[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureWord "Update"]

[Metadata]
Name=4000 English Words
Author=Mumbela Simonda
Information=Shows a random English word from a list of 4000 words. One word every 5 minutes.
Version=1.0.3
License=Creative Commons Attribution - Non - Commercial - Share Alike 3.0

[Variables]
@Includes=#@#variables.inc
WordFile=#@#words.txt
LastWordFile=#@#last_word.txt
SkinHeight=56
Padding=8

[MeterBackground]
Meter=Image
LeftMouseUpAction=[!Refresh]
DynamicVariables=1
W=([MeterString:W]+(#Padding#*2))
H=#SkinHeight#
SolidColor=#SolidColor#

[MeterString]
Meter=String
Text=[&MeasureWord]
DynamicVariables=1
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#FontColor#
StringStyle=#StringStyle#
StringAlign=Left
AntiAlias=1
X=#Padding#
Y=(#Padding#-1)
H=(#SkinHeight#-(#Padding#*2))
ClipString=1

[MeasureWord]
Measure=Script
ScriptFile=#@#scripts/Script.lua
UpdateDivider=300
