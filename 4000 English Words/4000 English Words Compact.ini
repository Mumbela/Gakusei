[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!CommandMeasure MeasureWord "Update"]

[Metadata]
Name=4000 English Words Compact
Author=Mumbela Simonda
Information=Shows a random English word from a list of 4000 words in a tighter single-line layout.
Version=1.0.1
License=Creative Commons Attribution - Non - Commercial - Share Alike 3.0

[Variables]
@Includes=#@#variables.inc
WordFile=#@#words.txt
LastWordFile=#@#last_word.txt
SkinWidth=560
SkinHeight=44
Padding=8
CompactFontSize=18

[MeterBackground]
Meter=Image
LeftMouseUpAction=[!Refresh]
W=#SkinWidth#
H=#SkinHeight#
SolidColor=#SolidColor#

[MeterString]
Meter=String
Text=[&MeasureWord]
DynamicVariables=1
FontFace=#FontFace#
FontSize=#CompactFontSize#
FontColor=#FontColor#
StringStyle=#StringStyle#
StringAlign=Left
AntiAlias=1
X=#Padding#
Y=(#Padding#-1)
W=(#SkinWidth#-(#Padding#*2))
H=(#SkinHeight#-(#Padding#*2))
ClipString=1

[MeasureWord]
Measure=Script
ScriptFile=#@#scripts/Script.lua
UpdateDivider=300
