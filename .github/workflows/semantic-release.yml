name: Semantic Release and Skin Packaging

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Extract version from Git tag
        shell: pwsh
        run: |
          try {
            $version = git describe --tags --abbrev=0
          } catch {
            Write-Host "No tags found. Defaulting to 0.0.0"
            $version = "0.0.0"
          }

          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version set to $version"

      - name: Install Rainmeter and locate SkinInstaller.exe
        shell: pwsh
        run: |
          $url = "https://github.com/rainmeter/rainmeter/releases/download/v4.5.18.3727/Rainmeter-4.5.18.exe"
          $path = "$env:RUNNER_TEMP\RainmeterSetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $path
          Start-Process -Wait -FilePath $path -ArgumentList "/S"

          $candidates = @(
            "C:\Program Files\Rainmeter\SkinInstaller.exe",
            "C:\Program Files (x86)\Rainmeter\SkinInstaller.exe"
          )

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Copy-Item $candidate .\
              Write-Host "Found and copied SkinInstaller.exe from $candidate"
              break
            }
          }

          if (-not (Test-Path ".\SkinInstaller.exe")) {
            Write-Error "SkinInstaller.exe not found"
            exit 1
          }

      - name: Package all skins
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path "RMSKIN" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $packageRoot = "RMSKIN\Gakusei"

          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          Copy-Item -Path "4000 English Words" -Destination $packageRoot -Recurse -Force

          if (Test-Path "@Resources") {
            Copy-Item -Path "@Resources" -Destination "$packageRoot\@Resources" -Recurse -Force
            Write-Host "Copied @Resources into package root"
          }

          Write-Host "`nPackaging: $packageRoot"
          ./SkinInstaller.exe $packageRoot /S /Log

          $package = Get-ChildItem -Path "RMSKIN" -Filter "*.rmskin" -File -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $package) {
            Write-Error "Failed to create .rmskin package"
            exit 1
          }

          $releasePackage = "dist\Gakusei-$env:VERSION.rmskin"
          Move-Item -Path $package.FullName -Destination $releasePackage -Force
          Write-Host "Packaged $releasePackage"

      - name: Show packaging logs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter InstallLog.txt | ForEach-Object {
            Write-Host "`nLog: $($_.FullName)"
            Get-Content $_.FullName
          }

      - name: Show RMSKIN workspace contents
        shell: pwsh
        run: |
          Get-ChildItem -Path "RMSKIN" -Recurse | Select-Object FullName

      - name: Upload all .rmskin packages
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            dist/*.rmskin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List output files
        shell: pwsh
        run: |
          Get-ChildItem -Path "dist" -Filter "*.rmskin" -File | Select-Object -ExpandProperty FullName
